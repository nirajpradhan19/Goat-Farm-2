<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d99b"/>
      <stop offset="1" stop-color="#faf6ee"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d7a63"/>
      <stop offset="1" stop-color="#3f6350"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a3d"/>
      <stop offset="1" stop-color="#1c2e26"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="640" height="560" rx="28" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="500" cy="110" r="54" fill="#e0a83e" opacity="0.9"/>
  <circle cx="500" cy="110" r="76" fill="#e0a83e" opacity="0.18"/>

  <!-- clouds -->
  <g opacity="0.8" fill="#ffffff">
    <ellipse cx="130" cy="95" rx="46" ry="18"/>
    <ellipse cx="165" cy="85" rx="34" ry="16"/>
    <ellipse cx="95" cy="88" rx="30" ry="14"/>
  </g>

  <!-- far hill -->
  <path d="M0 300 Q 120 230 260 280 T 520 260 T 640 300 V 560 H 0 Z" fill="url(#hill1)" opacity="0.55"/>
  <!-- near hill -->
  <path d="M0 360 Q 160 300 320 350 T 640 340 V 560 H 0 Z" fill="url(#hill2)"/>

  <!-- barn -->
  <g transform="translate(56,300)">
    <rect x="0" y="40" width="120" height="86" fill="#c1673b"/>
    <polygon points="0,40 60,0 120,40" fill="#a8532d"/>
    <rect x="48" y="76" width="26" height="50" fill="#f4ede0"/>
    <rect x="14" y="60" width="22" height="22" fill="#f4ede0"/>
    <rect x="84" y="60" width="22" height="22" fill="#f4ede0"/>
    <rect x="-6" y="122" width="132" height="8" fill="#1c2e26" opacity="0.25"/>
  </g>

  <!-- fence -->
  <g stroke="#6b4a34" stroke-width="6" stroke-linecap="round">
    <line x1="210" y1="420" x2="210" y2="470"/>
    <line x1="250" y1="420" x2="250" y2="470"/>
    <line x1="290" y1="420" x2="290" y2="470"/>
    <line x1="330" y1="420" x2="330" y2="470"/>
    <line x1="205" y1="432" x2="335" y2="432"/>
    <line x1="205" y1="452" x2="335" y2="452"/>
  </g>

  <!-- grass tufts -->
  <g stroke="#2e4a3d" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M140 470 q6 -22 0 -30"/>
    <path d="M150 470 q0 -26 8 -32"/>
    <path d="M160 470 q-4 -18 4 -26"/>
    <path d="M540 480 q6 -22 0 -30"/>
    <path d="M552 480 q0 -26 8 -32"/>
    <path d="M564 480 q-4 -18 4 -26"/>
  </g>

  <!-- ===== GOAT ===== -->
  <g transform="translate(300,190)">
    <!-- shadow -->
    <ellipse cx="130" cy="322" rx="120" ry="16" fill="#1c2e26" opacity="0.18"/>

    <!-- tail -->
    <ellipse cx="10" cy="210" rx="14" ry="20" fill="#f4ede0" transform="rotate(-20 10 210)"/>

    <!-- back legs -->
    <rect x="60" y="255" width="18" height="80" rx="8" fill="#6b4a34"/>
    <rect x="190" y="255" width="18" height="80" rx="8" fill="#6b4a34"/>
    <!-- front legs -->
    <rect x="95" y="255" width="18" height="85" rx="8" fill="#5a3d2b"/>
    <rect x="230" y="255" width="18" height="85" rx="8" fill="#5a3d2b"/>
    <!-- hooves -->
    <rect x="58" y="325" width="22" height="14" rx="5" fill="#2b2621"/>
    <rect x="188" y="325" width="22" height="14" rx="5" fill="#2b2621"/>
    <rect x="93" y="330" width="22" height="14" rx="5" fill="#2b2621"/>
    <rect x="228" y="330" width="22" height="14" rx="5" fill="#2b2621"/>

    <!-- body -->
    <ellipse cx="150" cy="230" rx="120" ry="70" fill="#f4ede0"/>
    <!-- body patch -->
    <ellipse cx="90" cy="250" rx="46" ry="34" fill="#e6d8bd"/>

    <!-- neck / chest -->
    <path d="M232 190 Q 270 150 258 100 L 210 110 Q 208 165 232 190 Z" fill="#c1673b"/>

    <!-- head -->
    <g transform="translate(232,60)">
      <ellipse cx="40" cy="55" rx="46" ry="40" fill="#c1673b"/>
      <!-- snout -->
      <ellipse cx="78" cy="72" rx="24" ry="18" fill="#e0a83e"/>
      <ellipse cx="86" cy="70" rx="3" ry="4" fill="#2b2621"/>
      <ellipse cx="86" cy="80" rx="3" ry="4" fill="#2b2621"/>
      <!-- beard -->
      <path d="M70 92 q10 22 -4 30 q-14 -6 -10 -26 Z" fill="#e6d8bd"/>
      <!-- ears -->
      <path d="M6 34 Q -26 26 -22 54 Q 4 58 18 42 Z" fill="#a8532d"/>
      <path d="M62 8 Q 60 -24 88 -18 Q 90 12 70 22 Z" fill="#a8532d"/>
      <!-- horns -->
      <path d="M22 8 Q 8 -34 30 -58" stroke="#5a3d2b" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M46 2 Q 44 -40 66 -62" stroke="#3a271b" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- eye -->
      <ellipse cx="46" cy="46" rx="6" ry="8" fill="#2b2621"/>
      <ellipse cx="48" cy="43" rx="2" ry="2.4" fill="#fff"/>
    </g>
  </g>

  <!-- foreground grass strip -->
  <path d="M0 500 Q 160 470 320 500 T 640 495 V 560 H 0 Z" fill="#3f6350"/>
</svg>
