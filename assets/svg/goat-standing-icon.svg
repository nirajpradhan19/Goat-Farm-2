<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" fill="none">
  <g>
    <!-- tail -->
    <ellipse cx="100" cy="292" rx="20" ry="24" fill="#efe9da" transform="rotate(-15 100 292)"/>

    <!-- back legs -->
    <rect x="120" y="380" width="26" height="130" rx="12" fill="#c9a866"/>
    <rect x="188" y="382" width="26" height="132" rx="12" fill="#c9a866"/>
    <!-- front legs -->
    <rect x="300" y="380" width="26" height="134" rx="12" fill="#b6934f"/>
    <rect x="356" y="378" width="26" height="132" rx="12" fill="#b6934f"/>
    <!-- hooves -->
    <rect x="116" y="498" width="34" height="16" rx="7" fill="#2b2621"/>
    <rect x="184" y="500" width="34" height="16" rx="7" fill="#2b2621"/>
    <rect x="296" y="500" width="34" height="16" rx="7" fill="#2b2621"/>
    <rect x="352" y="498" width="34" height="16" rx="7" fill="#2b2621"/>

    <!-- body -->
    <ellipse cx="255" cy="340" rx="175" ry="105" fill="#efe9da"/>

    <!-- neck -->
    <path d="M370 300 Q 415 240 400 165 L 330 175 Q 322 250 370 300 Z" fill="#efe9da"/>

    <!-- head -->
    <g transform="translate(330,70)">
      <ellipse cx="90" cy="90" rx="86" ry="78" fill="#efe9da"/>
      <!-- snout / mouth area -->
      <ellipse cx="150" cy="118" rx="34" ry="24" fill="#d8a556"/>
      <path d="M132 128 Q150 142 168 128" stroke="#2b2621" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="142" cy="112" rx="3.2" ry="4" fill="#2b2621"/>
      <ellipse cx="160" cy="112" rx="3.2" ry="4" fill="#2b2621"/>
      <!-- ears -->
      <path d="M14 66 Q -30 50 -20 96 Q 18 100 38 74 Z" fill="#efe9da" stroke="#2b2621" stroke-width="3"/>
      <path d="M100 12 Q 96 -34 140 -22 Q 146 20 108 34 Z" fill="#efe9da" stroke="#2b2621" stroke-width="3"/>
      <!-- horns -->
      <path d="M56 20 Q 30 -40 66 -78" stroke="#c9a866" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M56 20 Q 30 -40 66 -78" stroke="#2b2621" stroke-width="2" fill="none" opacity="0.25"/>
      <path d="M104 6 Q 96 -54 140 -86" stroke="#b6934f" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M104 6 Q 96 -54 140 -86" stroke="#2b2621" stroke-width="2" fill="none" opacity="0.25"/>
      <!-- eyes -->
      <circle cx="98" cy="82" r="5.5" fill="#1c1a16"/>
      <circle cx="126" cy="84" r="5.5" fill="#1c1a16"/>
    </g>

    <!-- soft brushy texture flecks (body) -->
    <g fill="#d8c89e" opacity="0.55">
      <ellipse cx="180" cy="300" rx="22" ry="7" transform="rotate(-10 180 300)"/>
      <ellipse cx="230" cy="370" rx="26" ry="8" transform="rotate(6 230 370)"/>
      <ellipse cx="300" cy="310" rx="20" ry="6" transform="rotate(-16 300 310)"/>
      <ellipse cx="130" cy="360" rx="18" ry="6" transform="rotate(12 130 360)"/>
      <ellipse cx="340" cy="365" rx="16" ry="6" transform="rotate(-8 340 365)"/>
      <ellipse cx="210" cy="330" rx="14" ry="5" transform="rotate(20 210 330)"/>
    </g>
    <!-- shading along back/legs -->
    <path d="M110 300 Q 250 250 400 300" stroke="#d8c89e" stroke-width="10" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>
</svg>
