  <!-- goat 2 (kid, small) -->
  <g transform="translate(150,560) scale(0.62)">
    <rect x="60" y="150" width="20" height="86" rx="9" fill="#a8532d"/>
    <rect x="200" y="150" width="20" height="86" rx="9" fill="#a8532d"/>
    <rect x="98" y="150" width="20" height="92" rx="9" fill="#8a4128"/>
