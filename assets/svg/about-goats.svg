      <ellipse cx="82" cy="76" rx="25" ry="19" fill="#f4d99b"/>
      <ellipse cx="90" cy="74" rx="3" ry="4" fill="#2b2621"/>
      <ellipse cx="90" cy="84" rx="3" ry="4" fill="#2b2621"/>
